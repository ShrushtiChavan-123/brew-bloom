apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: brew-bloom-network-policy
spec:
  podSelector:
    matchLabels:
      app: brew-bloom
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: brew-bloom-db
      ports:
        - protocol: TCP
          port: 80
