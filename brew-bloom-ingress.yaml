apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: brew-bloom-ingress
spec:
  ingressClassName: traefik
  rules:
  - host: brew-bloom.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: brew-bloom-service
            port:
              number: 80
