apiVersion: batch/v1
kind: Job
metadata:
  name: brew-bloom-job
spec:
  completions: 1
  parallelism: 1
  template:
    spec:
      containers:
      - name: brew-bloom-task
        image: busybox:1.36
        command: ["/bin/sh", "-c", "echo 'Brew and Bloom task completed successfully!'"]
      restartPolicy: Never
