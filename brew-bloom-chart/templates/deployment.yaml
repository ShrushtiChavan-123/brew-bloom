apiVersion: apps/v1
kind: Deployment
metadata:
  name: brew-bloom
  labels:
    app: brew-bloom
spec:
  replicas: 2
  selector:
    matchLabels:
      app: brew-bloom
  template:
    metadata:
      labels:
        app: brew-bloom
    spec:
      containers:
        - name: brew-bloom
          image: brew-bloom:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
