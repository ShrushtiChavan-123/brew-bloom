apiVersion: batch/v1
kind: CronJob
metadata:
  name: brew-bloom-cronjob
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: brew-bloom-task
            image: busybox:1.36
            command:
            - /bin/sh
            - -c
            - echo "Brew and Bloom scheduled task executed successfully!"
          restartPolicy: OnFailure
