apiVersion: v1
kind: Pod
metadata:
  name: brew-bloom-storage-test
spec:
  containers:
  - name: storage-test
    image: busybox:1.36
    command: ["/bin/sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: brew-bloom-storage
      mountPath: /data
  volumes:
  - name: brew-bloom-storage
    persistentVolumeClaim:
      claimName: brew-bloom-pvc
