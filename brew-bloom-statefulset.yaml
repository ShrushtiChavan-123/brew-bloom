apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: brew-bloom-db
spec:
  serviceName: brew-bloom-db
  replicas: 2
  selector:
    matchLabels:
      app: brew-bloom-db
  template:
    metadata:
      labels:
        app: brew-bloom-db
    spec:
      containers:
      - name: database
        image: busybox:1.36
        command: ["/bin/sh", "-c", "sleep 3600"]
        ports:
        - containerPort: 80
