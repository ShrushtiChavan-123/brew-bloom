
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brew-bloom
spec:
  replicas: 4
  selector:
    matchLabels:
      app: brew-bloom
  template:
    metadata:
      labels:
        app: brew-bloom
    spec:
      containers:
      - name: brew-bloom
        image: brew-bloom:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: brew-bloom-config
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: brew-bloom-service
spec:
  type: ClusterIP
  selector:
    app: brew-bloom
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP

